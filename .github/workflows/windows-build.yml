name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows EXE
        run: npm run windows-build -- --publish never

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: 7rF-Windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.7z
          if-no-files-found: error
